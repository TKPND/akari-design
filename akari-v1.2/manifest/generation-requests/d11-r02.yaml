shared_prompt: >-
  Use the five visible accepted images only in their declared roles to create
  one standalone Daily Wave 3 life-action scene of the same naturally cute
  25-year-old adult Akari. Image 1 controls recent adult identity, healthy body
  volume, normal short bob, complete character-left ornament, oversized opaque
  white hoodie, opaque gray pleated skirt, striped socks, and restrained room
  rendering; do not copy its sleepy state, side-lying pose, cushion, or close
  rug crop. Image 2 controls only stable shallow sofa-edge sitting, both knees
  pointing modestly forward, bilateral shin readability, and two flat socked
  feet on the floor; do not copy its tired expression, hand positions, warm
  evening light, or empty lap. Image 3 controls only the plain near-neutral rug
  material, soft contact shadows, and quiet compact-room floor context; do not
  copy its morning bed hair, T-shirt, extended-leg pose, plant, or bed. Image 4
  controls hairpin-side three-quarter identity, complete character-left
  pale-blue crossed pins and ribbon-like ornament, cheek contour, and short-bob
  side construction; do not copy standing, shoes, smile, or white backdrop.
  Image 5 controls warm-white mid-calf socks with exactly two thin pale-blue
  stripes, healthy ankle and foot volume, relaxed heels and toes, and believable
  knit shape; do not copy its floor-sitting pose, smile, or white backdrop.

  Show Akari folding laundry during soft diffused late-afternoon daylight in
  the same compact room. Use a vertical 1024 by 1536 portrait composition and a
  gently elevated front-left three-quarter camera. Seat her at the very front
  edge of one low plain neutral sofa with both sitting bones supported, torso
  leaning only slightly forward from the hips, spine natural, shoulders level,
  and full body visible from ornament and crown through both socked heels and
  toes. Both knees point modestly forward and remain separated by a natural
  hand-width. Both lower legs descend independently with no crossover. Place
  both socked feet fully flat on the rug, separated and side by side, with both
  complete two-stripe cuffs, ankles, heels, and toes unobscured. Never hide one
  leg or foot behind the other, crop either foot, point the soles toward the
  viewer, or create tiptoe contact. Keep the opaque skirt securely covering the
  pelvis and upper thighs with natural seated folds and no underwear view.

  Place one small pale-blue rectangular towel horizontally across her lap,
  below the hoodie hem and above both knees, halfway through one simple
  lengthwise fold. Each hand holds a different near corner of that same towel.
  Show both hands separately with five natural fingers, neutral wrists, and
  clear fabric contact. Keep the towel as one coherent rectangle with readable
  edges and folds; it must not hide either hand, the sofa support, either knee,
  shin, sock, heel, or toe. Direct both open eyes down at the towel with relaxed
  brows, warm neutral cheeks, and a small closed task-focused mouth. Preserve
  the complete character-left ornament and normal short bob. The image is
  practical non-sensual character documentation, not posing, viewer
  performance, a pin-up, or an anatomy plate.

  Include exactly two Humanization details: push the character-right hoodie
  cuff up by about one thumb width, and place one already-folded warm-white
  towel slightly askew on the sofa beside her character-left hip. Put one low
  plain open laundry basket on the rug at character-left, safely clear of her
  foot. The basket may contain only two indistinct folded neutral towels below
  its rim. Allow only the sofa, rug, basket, the working pale-blue towel, and one
  visible folded warm-white towel. Do not add underwear, laundry socks, shirts,
  pants, loose clothing, washing machine, detergent, clothesline, phone,
  charger, cable, bag, drink, food, bed, mirror, clock, footwear, blanket,
  second basket, extra towel outside the basket, text, logo, or explanatory
  prop. The scene is calm, awake, healthy, and task-focused, never sleepy,
  collapsed, sad, distressed, ill, intoxicated, dissociated, sensual, fetish,
  glamorous, or staged for the viewer.

  When references conflict, D10 controls recent adult identity, outfit, and
  rendering; D07 controls only sofa-edge support and bilateral foot placement;
  D02 controls only rug context; C03 controls three-quarter identity and
  ornament; and C07 controls socks and feet. Do not create closed eyes, tears,
  open mouth, broad smile, viewer focus, wrong ornament side, missing ornament
  parts, wrong hair length, wrong outfit, exposed underwear, bare feet, removed
  sock, wrong sock stripes, cropped head hand towel basket pelvis knee shin sock
  heel or toe, fused missing extra or malformed fingers, broken wrists,
  disconnected arms, twisted neck spine shoulder ribcage pelvis knee or ankle,
  fused hidden crossed or untraceable legs, one hidden foot, floating body or
  props, impossible towel geometry, duplicated towel or basket, forbidden
  props, readable text, logo, watermark, border, collage, grid, multiple
  characters, or severe identity, adult-age, anatomy, continuity, or rendering
  drift.
scene_contract:
  camera: gently-elevated-front-left-three-quarter-portrait-full-body
  location: compact-room-low-neutral-sofa-and-plain-rug
  support: front-sofa-edge-seat-with-bilateral-flat-rug-foot-contact
  action: two-hand-single-towel-fold-across-lap
  continuity: recent-standard-outfit-normal-hair-and-restrained-room-rendering
  lighting: soft-diffused-late-afternoon-daylight
  gaze: both-open-eyes-down-at-working-towel
  pose: modest-forward-knees-separated-shins-and-flat-feet
  humanization:
    - character-right-hoodie-cuff-pushed-up-one-thumb-width
    - one-folded-warm-white-towel-slightly-askew-on-sofa
  outfit:
    top: oversized-opaque-white-hoodie
    bottom: opaque-gray-pleated-skirt
    socks: warm-white-mid-calf-exactly-two-thin-pale-blue-stripes
  required_visible_features:
    - complete-head-character-left-ornament-and-both-open-eyes
    - separate-five-finger-hands-on-different-near-towel-corners
    - one-coherent-pale-blue-rectangular-working-towel-across-lap
    - stable-ribcage-pelvis-and-sofa-support
    - separately-traceable-bilateral-thigh-knee-shin-lines
    - both-flat-striped-socks-ankles-heels-and-relaxed-toes
    - one-low-basket-and-one-visible-askew-folded-towel
  forbidden_props: [underwear, laundry-socks, shirts, pants, loose-clothing, washing-machine, detergent, clothesline, phone, charger, cable, bag, drink, food, bed, mirror, clock, footwear, blanket, second-basket, extra-towel, explanatory-prop]
