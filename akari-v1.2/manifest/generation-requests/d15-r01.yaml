shared_prompt: >-
  Use the five visible accepted images only in their declared roles to create
  one fresh standalone Daily Wave 3 scene of the same naturally cute
  25-year-old adult Akari as she relaxes her posture in front of one desktop
  computer after a focused household task. Image 1 controls recent adult
  identity, healthy body volume, normal short bob, complete character-left
  ornament, oversized opaque white hoodie, opaque gray pleated skirt, striped
  socks, calm everyday presence, and restrained daylight rendering; do not copy
  its sofa, bag, notebook, pouch, handkerchief, hand action, or room geometry.
  Image 2 controls only compact-room scale and the plain light-wood desk family;
  do not copy its standing pose, open drawer, charger, cable, organizer,
  notebook, hand action, or exact camera. Image 3 controls stable seated pelvis
  support, separate knees and shins, bilateral flat socked feet, and ordinary
  seated body volume; do not copy its sofa, towel, basket, laundry, hand action,
  window, or rug. Image 4 controls hairpin-side three-quarter identity, complete
  character-left pale-blue crossed pins and ribbon-like ornament, cheek contour,
  and short-bob side construction; do not copy shoes, smile, or white backdrop.
  Image 5 controls seated warm-white mid-calf socks with exactly two thin
  pale-blue stripes, healthy ankles and feet, flat heels, relaxed toes, and
  believable knit shape; do not copy its floor pose, smile, or white backdrop.

  Show Akari as she relaxes her posture in front of one desktop computer in a
  compact plain room during soft diffused neutral late-afternoon light. Use a
  vertical 1024 by 1536 portrait composition and a gently elevated front
  three-quarter camera. Place one compact plain light-wood desk on the
  screen-left side and one plain warm-gray armless desk chair immediately to its
  screen-right, angled slightly toward the camera. Seat Akari fully on the chair
  with her pelvis, lower back, and one side of her ribcage visibly supported by
  the seat and low backrest. The clear near desk corner must remain beside her,
  never crossing her torso, skirt, pelvis, either leg, or either foot.

  Make one supported awake posture break, not an active computer task. The arm
  closest to the desk rests its elbow on the clear near desk corner, with that
  hand lightly supporting the same side of her cheek. Keep all five fingers
  natural and outside the eye and mouth, the wrist neutral, and the head only
  lightly inclined into the palm. The other visible hand rests open and relaxed
  on the corresponding thigh with five natural fingers and no held object.
  Neither hand touches the keyboard, mouse, monitor, switch, or another device.
  Keep both hands distinct, fully visible, and connected to their arms.

  Allow one mild sideways torso lean from the supported pelvis, one small
  natural curve through the spine, and relaxed uneven shoulders. Keep the neck
  awake and supported, the chest open enough to breathe normally, and the body
  securely inside the chair. Never let her slide from the seat, dangle an arm,
  fall face-down, put her torso or head onto the desk, hang her head without
  support, or create limp or contradictory weight. Keep knees separate and
  forward, each leg independently traceable from hip through knee, shin, ankle,
  heel, and toe. Put both socked feet fully flat on the same visible floor in a
  relaxed small stagger. Never cross or fuse the legs, hide a foot behind the
  desk or chair, crop a heel or toe, use tiptoe contact, or point either sole at
  the viewer. Show her complete ornament and crown through both socked heels
  and toes.

  Direct both open eyes toward one dark blank unreadable screen with relaxed
  brows, healthy warm-neutral cheeks, and a small closed neutral mouth. The
  monitor shows no interface, icon, cursor, window, reflection, image, glow,
  text, logo, or content. Akari is calm, awake, healthy, aware of the room, and
  taking a short ordinary posture break, never collapsed, ill, or asleep. This
  is practical non-sensual character documentation, not posing, viewer
  performance, a pin-up, an illness scene, or a computer advertisement.

  Include exactly two Humanization details: make one small diagonal seated fold
  in the front hoodie hem, and place one plain compact warm-gray keyboard
  slightly askew on the desk. Allow only Akari, one desk, one armless chair, one
  compact plain dark-framed desktop monitor and simple stand, the one blank
  keyboard, one plain mouse beside it, a neutral floor and wall, and one small
  plain desk mat. Keep all devices unbranded, supported, coherent, and free of
  visible cables. Do not show a tower, laptop, tablet, phone, second monitor,
  second keyboard, extra mouse, headset, speaker, webcam, game controller,
  charger, cable, adapter, outlet, power strip, drawer, organizer, notebook,
  paper, book, pen, clock, mirror, drink, food, medicine, blanket, pillow, bag,
  laundry, towel, basket, sofa, bed, refrigerator, footwear, text, logo, or
  explanatory prop. There is no second action.

  When references conflict, D14 controls recent adult identity, outfit, healthy
  body volume, calm everyday presence, and rendering; D13 controls only compact
  room scale and desk family; D11 controls stable seated body support and
  bilateral legs; C03 controls three-quarter identity and ornament; and C07
  controls seated socks and feet. Do not create closed or half-closed eyes,
  tears, pain, distress, sadness, illness, injury, fever, intoxication, sleep,
  unconsciousness, collapse, dissociation, sensuality, fetish, glamour, viewer
  focus, broad smile, open mouth, wrong ornament side, missing ornament parts,
  wrong hair length, extreme bed hair, wrong outfit, exposed underwear, bare
  feet, removed sock, wrong sock stripes, cropped head hand chair desk monitor
  torso pelvis knee shin sock heel or toe, fused missing extra or malformed
  fingers, broken wrists, disconnected arms, twisted neck spine shoulder
  ribcage pelvis knee or ankle, fused hidden crossed or untraceable legs, one
  hidden foot, floating body chair desk monitor keyboard mouse or limb,
  impossible chair seat backrest desk edge elbow cheek hand monitor stand
  keyboard mouse or floor geometry, duplicated devices or limbs, forbidden
  props, readable text, logo, watermark, border, collage, grid, multiple
  characters, or severe identity, adult-age, anatomy, state, continuity, or
  rendering drift.
